<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explorations with Leslie Tanner: Audience Panel</title>
<style>
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:#000;font-family:"Times New Roman",Times,serif;background-color:#428b86;background-image:url("background.jpg");background-repeat:repeat;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:480px;margin:0 auto;padding:16px 14px 36px;text-align:center}
h1{font-size:2rem;line-height:1.1;margin:10px 0 4px;font-weight:700}
.sub{font-style:italic;font-weight:700;font-size:1.15rem;margin:0 0 10px}
p{margin:0 0 12px;font-size:1.05rem}
.frame{display:inline-block;padding:6px;background:#fff;margin:4px 0 14px}
.frame div{border:8px solid #707070;padding:4px;background:#fff}
.frame img{display:block;width:140px;height:auto}
button{font:inherit;cursor:pointer}
.go,.ghost,.tab,.redeem{background:#e6e6e6;color:#000;border:2px solid;border-color:#fff #707070 #707070 #fff;border-radius:0;font-family:Arial,Helvetica,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;box-shadow:1px 1px 0 #000}
.go,.ghost{padding:14px;font-size:.95rem;width:100%}
.go{margin-top:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px 6px;font-size:.85rem}
.tab.on,.redeem:active:not(:disabled),.go:active,.ghost:active,.tab:active{border-color:#707070 #fff #fff #707070;background:#cfcfcf;box-shadow:none}
.redeem{position:relative;overflow:hidden;text-align:left;padding:14px;min-height:68px;display:flex;justify-content:space-between;align-items:center;width:100%}
.redeem b{font-size:1.05rem}
.redeem small{display:block;margin-top:3px;font-weight:400;text-transform:none;letter-spacing:0;font-size:.85rem;color:#222}
.redeem:disabled{background:#c4c4c4;color:#555;cursor:not-allowed}
.fill{position:absolute;left:0;bottom:0;height:5px;background:#2f7378;width:0}
input{width:100%;font-family:"Times New Roman",Times,serif;font-size:1.1rem;padding:12px;border:2px solid;border-color:#707070 #fff #fff #707070;border-radius:0;background:#fff;color:#000}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.credits{background:#fff;border:2px solid;border-color:#707070 #fff #fff #707070;padding:4px 10px;font-family:Arial,Helvetica,sans-serif;font-size:.9rem}
.grid{display:grid;gap:10px}
hr{border:0;border-top:2px solid #000;margin:22px 0 14px}
#toast{min-height:1.4em;margin-top:14px;font-weight:700}
.err{color:#6e0000;font-weight:700}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:5}
.dlg.hide{display:none}
.dbox{width:100%;max-width:480px;background:#e6e6e6;border:2px solid;border-color:#fff #707070 #707070 #fff;box-shadow:3px 3px 0 #000;padding:16px;display:grid;gap:10px;text-align:left}
.dbox b{font-size:1.2rem}
.drow{display:flex;gap:10px}.drow .go{margin-top:0}
footer{font-size:.9rem}
footer img{width:110px;display:block;margin:8px auto;border:3px solid #fff}
:focus-visible{outline:3px solid #000;outline-offset:2px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Explorations with Leslie Tanner</h1>
  <p class="sub">Live audience panel</p>
  <div class="frame"><div><img src="https://theprogramworks.com/assets/images/2025.8.1.leslietanner.website.headshot1.jpg" alt="Leslie Tanner" onerror="this.parentNode.parentNode.style.display='none'"></div></div>

  <section id="gate">
    <p>Enter the show code from the screen.</p>
    <input id="code" placeholder="Show code" autocomplete="off" autocapitalize="characters" aria-label="Show code">
    <button class="go" id="enter">Join the show</button>
    <div id="gateErr" class="err" role="alert"></div>
  </section>

  <section id="panel" class="hide">
    <div class="bar"><span>Pick an action</span><span class="credits" id="credits"></span></div>
    <div class="tabs" role="tablist"><button id="t-points" class="tab on" role="tab" aria-selected="true">Channel Points</button><button id="t-bits" class="tab" role="tab" aria-selected="false">Bits</button><button id="t-test" class="tab" role="tab" aria-selected="false">Test</button></div>
    <div id="grid" class="grid"></div>
    <div id="dlg" class="dlg hide" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><div class="dbox"><b id="dlgTitle"></b><input id="f-username" maxlength="25" placeholder="Your name" aria-label="Your name"><input id="f-message" maxlength="200" placeholder="Your message" aria-label="Your message"><div class="drow"><button class="go" id="dsend">Send</button><button class="ghost" id="dcancel">Cancel</button></div></div></div>
    <div id="toast" role="status"></div>
  </section>
<hr>
  <footer>Brought to you by<img src="https://theprogramworks.com/assets/logo/leslie-logo-white-web.png" alt="Leslie Tanner logo" onerror="this.style.display='none'"><b>Explorations International Inc.</b></footer>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var tab="points",ACTIONS=[],credits=0,code="";
var cid=(function(){try{var c=localStorage.getItem("cid");if(!c){c=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("cid",c)}return c}catch(e){return Math.random().toString(36).slice(2)+Date.now().toString(36)}})();
function api(p,b){return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function showCredits(){$("credits").textContent=credits+(credits===1?" credit":" credits")}
function toast(t,bad){var e=$("toast");e.textContent=t;e.className=bad?"err":""}
function enter(){
  var c=$("code").value.trim();
  api("/api/join",{code:c,clientId:cid}).then(function(d){
    if(!d.ok){$("gateErr").textContent="That code is not right. Check the screen and try again.";return}
    code=c;credits=d.credits;ACTIONS=d.actions;
    $("t-test").style.display=ACTIONS.some(function(a){return a.tab==="test"})?"":"none";
    $("gate").classList.add("hide");$("panel").classList.remove("hide");build();showCredits();
  }).catch(function(){$("gateErr").textContent="Can't reach the show. Check your connection."});
}
function build(){
  var g=$("grid");g.innerHTML="";
  ACTIONS.filter(function(r){return r.tab===tab}).forEach(function(r){
    var b=document.createElement("button");b.className="redeem";
    b.innerHTML="<span><b>"+r.name+"</b><br><small>"+(r.cost===0?"free":r.cost+" credit"+(r.cost>1?"s":""))+(r.fields?" · needs your input":"")+"</small></span><span class='fill'></span>";
    b.onclick=function(){press(r,b)};g.appendChild(b);
  });
}
function lock(b,secs){
  var f=b.querySelector(".fill");b.disabled=true;f.style.transition="none";f.style.width="100%";
  void f.offsetWidth;f.style.transition="width "+secs+"s linear";f.style.width="0";
  setTimeout(function(){b.disabled=false},secs*1000);
}
function press(r,b){
  if(r.fields){openDlg(r,b);return}
  send(r,b,{});
}
var cur=null;
function openDlg(r,b){
  cur={r:r,b:b};$("dlgTitle").textContent=r.name;
  ["username","message"].forEach(function(k){var e=$("f-"+k);e.value="";e.style.display=r.fields.indexOf(k)>-1?"":"none"});
  $("dlg").classList.remove("hide");
  $(r.fields[0]==="username"?"f-username":"f-message").focus();
}
function submitDlg(){
  var r=cur.r,v={};
  for(var i=0;i<r.fields.length;i++){var k=r.fields[i],t=$("f-"+k).value.trim();if(!t){toast("Please fill in everything.",true);return}v[k]=t}
  $("dlg").classList.add("hide");send(r,cur.b,v);
}
function send(r,b,v){
  b.disabled=true;
  api("/api/press",{code:code,clientId:cid,action:r.name,username:v.username||"",message:v.message||""}).then(function(d){
    if(d.credits!==undefined){credits=d.credits;showCredits()}
    if(!d.ok){b.disabled=false;toast(d.error,true);return}
    lock(b,d.cooldown);toast(r.name+" sent.");
  }).catch(function(){b.disabled=false;toast("Not sent. Check your connection.",true)});
}
["points","bits","test"].forEach(function(t){$("t-"+t).onclick=function(){tab=t;["points","bits","test"].forEach(function(x){var on=x===t;$("t-"+x).classList.toggle("on",on);$("t-"+x).setAttribute("aria-selected",on)});build();toast("")}});
$("enter").onclick=enter;
$("code").addEventListener("keydown",function(e){if(e.key==="Enter")enter()});
$("dsend").onclick=submitDlg;
$("dcancel").onclick=function(){$("dlg").classList.add("hide")};
</script>
</body>
</html>
